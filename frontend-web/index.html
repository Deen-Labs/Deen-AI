    <!-- Canonical URL -->
    <link rel="canonical" href="https://deenlabs.tech/" />
    <link rel="icon" type="image/png" href="/assets/new-app-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] },
            colors: { slate: { 950: "#070a13" }, zinc: { 900: "#12131a", 950: "#0b0c10" }, brand: { gold: "#e2a23b", goldsoft: "#ffdda8", accent: "#1e8f82" } },
            animation: { "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite", "bounce-slow": "bounce 2.5s infinite" }
          }
        }
      }
    </script>
    <style type="text/css">
      html { font-size: 16px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
      body { background-color: #05070e; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #070a13; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }
      ::selection { background-color: rgba(30, 143, 130, 0.3); color: #ffffff; }
    </style>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('deen_theme_mode') || 'dark';
          var isDark = stored === 'light' ? false : (stored === 'system' ? !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) : true);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('light', !isDark);
          document.documentElement.classList.toggle('dark', isDark);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="font-sans text-slate-100 antialiased min-h-screen flex flex-col">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
