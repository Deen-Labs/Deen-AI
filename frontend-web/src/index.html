<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deen-Labs — Enterprise Technology Lab, Domain AI & Cloud DevOps Consulting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] },
            colors: { slate: { 950: "#070a13" }, zinc: { 900: "#12131a", 950: "#0b0c10" }, brand: { gold: "#e2a23b", goldsoft: "#ffdda8", accent: "#1e8f82" } },
            animation: { "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite", "bounce-slow": "bounce 2.5s infinite" }
          }
        }
      }
    </script>
    <style type="text/css">
      html { font-size: 18px; scroll-behavior: smooth; }
      body { background-color: #070a13; background-image: radial-gradient(circle at 10% 20%, rgba(30, 143, 130, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(226, 162, 59, 0.04) 0%, transparent 45%); }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #070a13; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }
      ::selection { background-color: rgba(30, 143, 130, 0.3); color: #ffffff; }
    </style>
  </head>
  <body class="font-sans text-slate-100 antialiased min-h-screen flex flex-col cursor-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
